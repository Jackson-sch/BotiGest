<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#005bb5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Medical / Pharmacy Cross Icon with rounded caps -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="216" y="116" width="80" height="280" rx="36" fill="#ffffff"/>
    <!-- Horizontal bar -->
    <rect x="116" y="216" width="280" height="80" rx="36" fill="#ffffff"/>
  </g>
  
  <!-- Pill emblem detail -->
  <circle cx="256" cy="256" r="24" fill="#0071e3" opacity="0.15"/>
</svg>
