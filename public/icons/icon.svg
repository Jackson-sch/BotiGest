<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Sapphire to Precision Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004399" />
    </linearGradient>

    <!-- Ambient Glow Top-Left -->
    <radialGradient id="specularGlow" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Health Vitality Accent Gradient -->
    <linearGradient id="vitalityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>

    <!-- Pill Cyan Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001844" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Apple-style Squircle (Smooth Superellipse) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#specularGlow)" />
  <rect x="21" y="21" width="470" height="470" rx="111" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Center Emblem Group: Modern Health Cross + Stylized Pharmacological "B" -->
  <g filter="url(#softShadow)">
    <!-- Vertical Spine (Capsule-inspired column) -->
    <rect x="148" y="128" width="60" height="256" rx="30" fill="#FFFFFF" />

    <!-- Top Loop of "B" (Upper Capsule Chamber) -->
    <path
      d="M178 128 H284 C330 128 360 156 360 196 C360 236 330 256 284 256 H178"
      stroke="#FFFFFF"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Bottom Loop of "B" (Lower Capsule Chamber) -->
    <path
      d="M178 256 H304 C352 256 384 286 384 328 C384 370 352 384 304 384 H178"
      stroke="#FFFFFF"
      stroke-width="56"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Central Precision Medical Cross Core (Interlocking Symbol) -->
    <!-- Horizontal Cross Bar -->
    <rect x="100" y="228" width="156" height="56" rx="28" fill="#FFFFFF" />

    <!-- Pharmacological Core Pill Dot (Cyan/Emerald Vitality Beacon) -->
    <circle cx="282" cy="256" r="22" fill="url(#vitalityGrad)" />
    <circle cx="282" cy="256" r="14" fill="#FFFFFF" opacity="0.9" />

    <!-- Top Capsule Glass Accent -->
    <circle cx="280" cy="196" r="10" fill="url(#cyanAccent)" opacity="0.85" />
    <!-- Bottom Capsule Glass Accent -->
    <circle cx="294" cy="328" r="12" fill="url(#cyanAccent)" opacity="0.85" />
  </g>
</svg>
